[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simfea-studio"
version = "0.1.0"
description = "SimFEA Studio FastAPI sidecar for remote simulation evidence workflows."
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.95.2",
    "httpx",
    "uvicorn[standard]",
    "sse-starlette==1.6.5",
    "setuptools<81",
]

[project.optional-dependencies]
dev = [
    # Add development specific dependencies here if needed
]
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src/backends"]
